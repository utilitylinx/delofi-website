<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delofi | Corporate Registration</title>
    <style>
        :root { --primary: #0054ff; --dark: #111111; --light: #f8f9fa; --gray: #e0e0e0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: var(--dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); padding: 40px; width: 100%; max-width: 500px; text-align: center; }
        .logo-circle { width: 60px; height: 60px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; margin: 0 auto 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: #555; }
        .form-control { width: 100%; padding: 12px 15px; border: 2px solid var(--gray); border-radius: 8px; font-size: 15px; }
        .form-control:focus { border-color: var(--primary); outline: none; }
        .btn-main { width: 100%; background: var(--dark); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main:hover { background: var(--primary); }
        .alert { display: none; padding: 15px; border-radius: 8px; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-circle">D</div>
        <h2 style="margin-bottom: 10px;">Corporate Account Request</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Apply for a B2B account to dispatch rides for your guests and employees.</p>
        
        <div id="success-alert" class="alert">Application submitted! Our team will contact you shortly.</div>

        <div id="signup-form">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" class="form-control" placeholder="e.g. Utilitylinx Ltd">
            </div>
            <div class="form-group">
                <label>Contact Person</label>
                <input type="text" class="form-control" placeholder="Full Name">
            </div>
            <div class="form-group">
                <label>Business Email</label>
                <input type="email" class="form-control" placeholder="you@company.co.uk">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" class="form-control" placeholder="Best number to reach you">
            </div>
            <button class="btn-main" onclick="submitForm()">Submit Application</button>
        </div>
        <div style="margin-top: 20px;">
            <a href="/corporate" style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: bold;">← Back to Login</a>
        </div>
    </div>

    <script>
        function submitForm() {
            // We can easily connect this to Web3Forms later so it emails you directly!
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('success-alert').style.display = 'block';
        }
    </script>
</body>
</html>
